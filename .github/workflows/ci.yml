name: gate and deploy dev

# ─────────────────────────────────────────────────────────────────────────
# ON PUSH TO MAIN: prove the commit against a database, then ship dev.
#
# WHY A NEON BRANCH PER RUN (owner's ruling, 2026-09-17). The suite clones
# `zebra_template` into eight worker databases and holds an advisory lock for
# the whole run, so two runs against one database serialise — CI would queue
# behind a local deploy and a local deploy behind CI. A branch per run removes
# the contention rather than scheduling around it.
#
# It is branched FROM DEV WITH ITS DATA, which is the ruling and is what makes
# the run meaningful: the template is already built, and the timing probe has
# fourteen thousand loads to measure against instead of an empty schema.
#
# WHY `.env` IS WRITTEN RATHER THAN EXPORTED. `integration-gate.mjs` deletes
# DATABASE_URL, DIRECT_DATABASE_URL and NEON_BRANCH from the child's
# environment and reads `.env` itself — deliberately, because on 2026-08-14 a
# ritual terminal's leftovers aimed a run at production. THE SCRUB STAYS. CI
# writes the file the gate expects instead of loosening the gate.
#
# ── THE STEP ORDER IS LOAD-BEARING, AND THE FIRST RUN PROVED IT ──────────
#
# `npm ci` runs `prisma generate` as a postinstall, and `prisma.config.ts`
# REFUSES when NEON_BRANCH and DIRECT_DATABASE_URL are absent — by design: it
# will not guess which database it points at. So the branch is created and
# `.env` is written BEFORE the install, not after. Run 35300290050 failed in
# 49 seconds on exactly that, which is the cheapest possible way to learn it.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

# ONE RUN AT A TIME. Not for the database — each run has its own branch — but
# because two runs deploying the same worker would race, and the later push is
# the one worth shipping.
concurrency:
  group: gate-and-deploy-dev
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── THE PER-RUN DATABASE ─────────────────────────────────────────
      #
      # curl rather than a marketplace action: this is a private repository
      # holding a production TMS, and a third party in the credential path is
      # a decision nobody has made. Two API calls and jq cost less than that
      # conversation.
      #
      # FIRST, because the install needs a database to generate against.
      - name: create a Neon branch for this run
        id: branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: ${{ secrets.NEON_PARENT_BRANCH }}
          # DEV_DATABASE_URL IS DELIBERATELY NOT HERE. It used to carry the
          # application password to this step and it cost two runs doing it —
          # 35307302962, where the whole `.env` line arrived and no URL came
          # out of it, and 35308232556, where the password that did arrive was
          # refused by Postgres. The branch mints its own below, so the secret
          # has nothing left to do and is not wired in pretending otherwise.
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\":{\"parent_id\":\"${NEON_PARENT_BRANCH}\",\"name\":\"ci-${GITHUB_RUN_ID}\"},\"endpoints\":[{\"type\":\"read_write\"}]}")

          branch_id=$(echo "$response" | jq -r ".branch.id // empty")
          if [ -z "$branch_id" ]; then
            echo "Neon refused to create a branch:"
            echo "$response" | jq -r ".message // ."
            exit 1
          fi
          # RECORDED BEFORE ANYTHING ELSE CAN FAIL, so the cleanup step has an
          # id to delete even if the next command throws.
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"

          # ── COMPOSE THE CONNECTION STRING. NEON DOES NOT RETURN ONE ──
          #
          # MEASURED, run 35301176483. The create-branch response carries the
          # keys ["branch","databases","endpoints","operations","roles"] and NO
          # `connection_uris` — not an empty one, absent — while
          # `start_compute` was still running. The first two attempts assumed
          # that field existed and wrote an empty URL into `.env`, which the
          # suite met three steps later as `Invalid URL`.
          #
          # So the parts are read and the string is built: role, database,
          # endpoint host, and the password fetched with the one API call that
          # exists for it. The branch INHERITS the parent's roles, so this is
          # dev's own credential against a copy of dev.
          # THE OWNER OF `neondb`, NOT `roles[0]`. Run 35301311106 composed the
          # string with the first role in the list and the suite failed five
          # times with `permission denied to create database` — the template
          # clone needs CREATEDB, which only the owner has. The same mistake as
          # `databases[0]`, one field over: an index is not an identity.
          role=$(echo "$response" | jq -r '[.databases[] | select(.name == "neondb") | .owner_name][0] // empty')
          host=$(echo "$response" | jq -r ".endpoints[0].host // empty")
          # `neondb` BY NAME, not `databases[0]`. A branch copies every database
          # in the project — `zebra_template` and `zebra_w1..8` come along — and
          # which one lands first is not something to leave to an index.
          database=$(echo "$response" | jq -r '[.databases[].name] | (index("neondb") // 0) as $i | .[$i] // empty')

          if [ -z "$role" ] || [ -z "$host" ] || [ -z "$database" ]; then
            echo "Neon created branch $branch_id but the response is missing parts."
            echo "Response keys: $(echo "$response" | jq -rc "keys")"
            echo "roles: $(echo "$response" | jq -rc "[.roles[]?.name]")"
            echo "databases: $(echo "$response" | jq -rc "[.databases[]?.name]")"
            echo "endpoints: $(echo "$response" | jq -rc "[.endpoints[]?.host]")"
            exit 1
          fi

          reveal="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          reveal="${reveal}/branches/${branch_id}/roles/${role}/reveal_password"
          password=$(curl -sS "$reveal" -H "Authorization: Bearer ${NEON_API_KEY}" | jq -r ".password // empty")
          if [ -z "$password" ]; then
            echo "Neon would not reveal the password for role ${role} on ${branch_id}."
            exit 1
          fi
          echo "::add-mask::$password"

          # ── THE BRANCH GETS ITS OWN APPLICATION CREDENTIAL ───────────
          #
          # Run 35308232556 reached the gate — 1,915 of 1,939 tests passed —
          # and then two failed with `password authentication failed for user
          # zebra_app`. The application password was being carried from dev's
          # own `.env`, and a password that travels through a secret box, a
          # `%%@*`, a `new URL` and back can be wrong in ways none of those
          # steps can see: a `#` or a `?` inside it is a fragment or a query to
          # a URL parser, and a stale paste looks exactly like a correct one.
          #
          # None of that is worth diagnosing from here, because the branch does
          # not need dev's password at all. It is a THROWAWAY COPY, deleted at
          # the end of this job, so it gets a credential of its own and the
          # question stops existing. Dev is untouched — branches are isolated
          # and nothing in this job connects to dev.
          #
          # Hex, so the value crosses a shell, a URL and an SQL literal without
          # an escape having to survive any of them.
          app_role=zebra_app
          app_password=$(openssl rand -hex 24)
          echo "::add-mask::$app_password"

          # FIRST THE CONTROL PLANE, which knows the roles it created itself.
          reset="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          reset="${reset}/branches/${branch_id}/roles/${app_role}/reset_password"
          reset_body=$(curl -sS -X POST "$reset" -H "Authorization: Bearer ${NEON_API_KEY}")
          granted=$(echo "$reset_body" | jq -r ".role.password // .password // empty")

          if [ -n "$granted" ]; then
            app_password="$granted"
            echo "::add-mask::$app_password"
            echo "Neon reset ${app_role} on the branch."
          else
            # AND OTHERWISE THE DATABASE ITSELF. A role created by a migration
            # is an ordinary Postgres role the control plane has never heard
            # of; `reset_password` 404s on those and ALTER ROLE does not care
            # who created it.
            #
            # No connection string is composed here on purpose: PGPASSWORD and
            # flags, so an `@` or a `/` in the OWNER's password cannot
            # retarget the connection the way it could inside a URL.
            if ! command -v psql > /dev/null 2>&1; then
              echo "Neon would not reset ${app_role} and psql is not installed."
              echo "Neon said: $(echo "$reset_body" | jq -rc "." | head -c 300)"
              exit 1
            fi
            # HEX OR NOTHING, checked rather than assumed. The first attempt
            # passed the password as a psql variable and wrote `:'pw'` in the
            # statement — run 35309258353 answered `syntax error at or near
            # ":"`, because psql does not interpolate variables into a `-c`
            # string. Reaching for stdin instead would trade one guess about
            # psql's semantics for another, so the value is simply required to
            # be what `openssl rand -hex` produces, which has no quote, no
            # backslash and nothing an SQL literal can misread. If some later
            # edit sends something else through here, this stops rather than
            # interpolating it.
            case "$app_password" in
              '' | *[!0-9a-f]*)
                echo "The branch password is not hex; refusing to inline it."
                exit 1
                ;;
            esac
            export PGPASSWORD="$password"
            export PGSSLMODE=require
            if ! psql -h "$host" -U "$role" -d "$database" --no-psqlrc -q -v ON_ERROR_STOP=1 -c "ALTER ROLE ${app_role} WITH LOGIN PASSWORD '${app_password}'"; then
              echo "Could not set a password for ${app_role} on the branch."
              echo "It may not exist there, or ${role} may not administer it."
              exit 1
            fi
            unset PGPASSWORD
            echo "Set the branch's own password for ${app_role} directly."
          fi

          # ── THE TWO STRINGS ARE COMPOSED BY PARSING, NOT BY SPLICING ─
          #
          # This was six lines of shell and it cost run 35307302962. The
          # application URL was built with
          #
          #     credential=${DEV_DATABASE_URL%%@*}
          #
          # and a prefix strip CANNOT FAIL — the same hazard as `sed` and as
          # `cmd | tail`, for the fourth time in this repository. A wrapping
          # quote, a `psql ` the Neon console put in front, a stray newline, an
          # `@` inside the password: each yields a different wrong string and
          # none of them yield an error. The branch was created, the round trip
          # measured at 16ms, the `.env` written — and then 108 test FILES
          # failed to load saying `DATABASE_URL or DIRECT_DATABASE_URL is not a
          # URL`, which is this step's fact arriving four minutes late and a
          # hundred and eight times over.
          #
          # So the credential is PARSED. `scripts/ci-compose-urls.mjs` reads
          # both strings, says which one is malformed and prints its shape
          # WITHOUT its password, asserts the application role is `zebra_app`
          # and never the branch owner — run 35301618293's mistake, where
          # BYPASSRLS would have taken every tenant boundary with it — and
          # writes the two outputs itself, masked before they are written.
          #
          # `tests/ci-urls.test.ts` runs its output past `checkDbTarget`, the
          # very guard that refused the last attempt, rather than past a second
          # opinion about what a good URL looks like. All five of its breaks
          # have been watched failing.
          # Exported on their own lines: a backslash continuation has been
          # eaten in transit four times in this repository, and a joined
          # continuation is still valid shell, which is how it gets through.
          export OWNER_ROLE="$role" OWNER_PASSWORD="$password"
          export APP_ROLE="$app_role" APP_PASSWORD="$app_password"
          export ENDPOINT_HOST="$host" DATABASE_NAME="$database"
          node scripts/ci-compose-urls.mjs
          echo "Created branch ci-${GITHUB_RUN_ID} ($branch_id)"

      # ── THE FILE THE GATE READS, AND THE INSTALL NEEDS ───────────────
      #
      # NEON_BRANCH names this run rather than being left out: `prisma.config`
      # refuses a missing one, the gate refuses a file that says `production`,
      # and a value naming the run is more use in a log than either.
      - name: write .env from secrets and the branch
        env:
          DIRECT: ${{ steps.branch.outputs.direct }}
          POOLED: ${{ steps.branch.outputs.pooled }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SEED_OWNER_EMAIL: ${{ secrets.SEED_OWNER_EMAIL }}
          SEED_OWNER_PASSWORD: ${{ secrets.SEED_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "DATABASE_URL=${POOLED}"
            echo "DIRECT_DATABASE_URL=${DIRECT}"
            echo "NEON_BRANCH=ci-${GITHUB_RUN_ID}"
            echo "AUTH_SECRET=${AUTH_SECRET}"
            echo "R2_ACCOUNT_ID=${R2_ACCOUNT_ID}"
            echo "R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
            echo "R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
            echo "R2_BUCKET=${R2_BUCKET}"
            echo "R2_ENDPOINT=${R2_ENDPOINT}"
            echo "SEED_OWNER_EMAIL=${SEED_OWNER_EMAIL}"
            echo "SEED_OWNER_PASSWORD=${SEED_OWNER_PASSWORD}"
          } > .env
          echo "wrote .env with $(grep -c = .env) keys"

      # `prisma generate` runs here, as a postinstall, and reads the file above.
      - name: install
        run: npm ci

      # ── HOW FAR AWAY IS IT? MEASURED, AND PRINTED (owner's ruling) ────
      #
      # Standard GitHub runners give no region choice, so this run's latency to
      # us-east-2 is a fact to be read rather than arranged. Every number the
      # suite prints — the money screen's 2.2 seconds most of all — sits on top
      # of this figure, and a timing recorded without it is a measurement of an
      # unknown place.
      #
      # NO PAID RUNNER UNLESS THIS NUMBER SAYS SO. That is the ruling, and this
      # is the number it is about. It needs `node_modules`, so it follows the
      # install rather than leading the job.
      - name: measure the round trip to the branch
        env:
          PGURL: ${{ steps.branch.outputs.direct }}
        run: node scripts/ci-round-trip.mjs

      # ── AND THE TREE MUST BE CLEAN WHEN THE SUITE STARTS ─────────────
      #
      # `.env` and `src/generated/` are both gitignored, so writing the first
      # and generating the second leaves the tree clean — asserted rather than
      # assumed, because the receipt refuses a dirty tree and a failure here is
      # far cheaper than one twelve minutes in.
      - name: the working tree is clean
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "The tree is dirty before the suite has run:"
            git status --porcelain
            exit 1
          fi
          echo "clean at $(git rev-parse --short HEAD)"

      - name: gate
        run: npm run check

      # EARNS THE RECEIPT. `deploy:dev` below accepts it rather than running
      # the suite a second time — same commit, same endpoint, same run.
      - name: integration suite
        run: npm run test:integration

      # ── SHIPPING IS OPT-IN, BY A REPOSITORY VARIABLE ─────────────────
      #
      # `CI_DEPLOY` is a repository VARIABLE (Settings -> Secrets and
      # variables -> Actions -> Variables), not a secret: it holds no
      # credential and its value should be readable in a log.
      #
      # UNSET MEANS PROVE, DO NOT SHIP. The first run of a pipeline that
      # deploys is a pipeline nobody has watched deploying, and the honest
      # order is to see it go green once against a real database before it is
      # allowed to move a worker. Set it to `true` when the runs are boring.
      - name: deploy dev
        if: vars.CI_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:dev

      - name: say why nothing was deployed
        if: vars.CI_DEPLOY != 'true'
        run: |
          echo "CI_DEPLOY is not 'true', so this run proved the commit and shipped nothing."
          echo "Set the repository variable CI_DEPLOY=true to let pushes deploy dev."

      # ── THE FAILURE LOG SURVIVES THE RUNNER ──────────────────────────
      #
      # `tests/failure-log.ts` exists because a crash mid-run renders no
      # summary. On a runner the whole machine disappears, so the file leaves
      # with the run or the evidence dies with it.
      - name: keep the failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failures-${{ github.run_id }}
          path: .integration-failures.log
          if-no-files-found: ignore

      # ── ALWAYS. A LEAKED BRANCH IS A BILL AND A MYSTERY ──────────────
      - name: delete the Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: |
          set -euo pipefail
          curl -sS -X DELETE \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_KEY}" > /dev/null
          echo "deleted branch ${BRANCH_ID}"
