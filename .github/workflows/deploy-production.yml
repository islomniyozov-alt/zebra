name: deploy production

# ─────────────────────────────────────────────────────────────────────────
# MANUAL ONLY, AND AFTER THE MIGRATION RITUAL (owner's ruling, 2026-09-17).
#
# Production is never deployed by a push. `prisma migrate deploy` against the
# production branch is a one-shot command run by a person, from a terminal,
# with `ALLOW_PROD_MIGRATION=1` and a direct URL that must not outlive it —
# see the README. This workflow is what happens AFTER that, and it refuses on
# its own if the marker says the schema is behind.
#
# ── THE PRODUCTION CREDENTIAL HERE IS READ-ONLY ──────────────────────────
#
# `deploy.mjs` touches production for exactly two questions: which migrations
# `_prisma_migrations` says are applied, and whether stored billing statuses
# agree with `billingStatusFor`. Both are SELECTs. So the secret is a
# `zebra_ci_readonly` role with SELECT and BYPASSRLS and nothing else — the
# ruling, to be revisited before tenant #2, because BYPASSRLS is the whole
# tenant fence turned off for one role.
#
# ── AND THE SUITE STILL RUNS, ON ITS OWN BRANCH ──────────────────────────
#
# `deploy:prod` requires a receipt, and a receipt is earned by a real run
# against a real database. That run happens here on a per-run Neon branch from
# DEV — production's own data is never a test fixture — which is the same
# arrangement the local flow has always had.
#
# THE STEP ORDER MATCHES ci.yml, and for the same reason: `npm ci` runs
# `prisma generate`, which refuses without a declared database, so the branch
# and `.env` come first. Everything that needs `node_modules` — the migration
# gap check included — follows the install.
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the word production to confirm'
        required: true
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # A TYPED WORD, BECAUSE THE BUTTON IS THE WHOLE SAFETY OTHERWISE.
      # A dispatch form with one button is a production deploy one misclick
      # away; this costs ten seconds and removes that.
      - name: confirm
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "production" ]; then
            echo "Refusing: type the word production to confirm."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: create a Neon branch for this run
        id: branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: ${{ secrets.NEON_PARENT_BRANCH }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
            -H "Authorization: Bearer ${NEON_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"branch\":{\"parent_id\":\"${NEON_PARENT_BRANCH}\",\"name\":\"ci-prod-${GITHUB_RUN_ID}\"},\"endpoints\":[{\"type\":\"read_write\"}]}")

          branch_id=$(echo "$response" | jq -r ".branch.id // empty")
          if [ -z "$branch_id" ]; then
            echo "Neon refused to create a branch:"
            echo "$response" | jq -r ".message // ."
            exit 1
          fi
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"

          # ── COMPOSE THE CONNECTION STRING. NEON DOES NOT RETURN ONE ──
          #
          # MEASURED, run 35301176483. The create-branch response carries the
          # keys ["branch","databases","endpoints","operations","roles"] and NO
          # `connection_uris` — not an empty one, absent — while
          # `start_compute` was still running. The first two attempts assumed
          # that field existed and wrote an empty URL into `.env`, which the
          # suite met three steps later as `Invalid URL`.
          #
          # So the parts are read and the string is built: role, database,
          # endpoint host, and the password fetched with the one API call that
          # exists for it. The branch INHERITS the parent's roles, so this is
          # dev's own credential against a copy of dev.
          role=$(echo "$response" | jq -r ".roles[0].name // empty")
          host=$(echo "$response" | jq -r ".endpoints[0].host // empty")
          # `neondb` BY NAME, not `databases[0]`. A branch copies every database
          # in the project — `zebra_template` and `zebra_w1..8` come along — and
          # which one lands first is not something to leave to an index.
          database=$(echo "$response" | jq -r '[.databases[].name] | (index("neondb") // 0) as $i | .[$i] // empty')

          if [ -z "$role" ] || [ -z "$host" ] || [ -z "$database" ]; then
            echo "Neon created branch $branch_id but the response is missing parts."
            echo "Response keys: $(echo "$response" | jq -rc "keys")"
            echo "roles: $(echo "$response" | jq -rc "[.roles[]?.name]")"
            echo "databases: $(echo "$response" | jq -rc "[.databases[]?.name]")"
            echo "endpoints: $(echo "$response" | jq -rc "[.endpoints[]?.host]")"
            exit 1
          fi

          reveal="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          reveal="${reveal}/branches/${branch_id}/roles/${role}/reveal_password"
          password=$(curl -sS "$reveal" -H "Authorization: Bearer ${NEON_API_KEY}" | jq -r ".password // empty")
          if [ -z "$password" ]; then
            echo "Neon would not reveal the password for role ${role} on ${branch_id}."
            exit 1
          fi
          echo "::add-mask::$password"

          direct="postgresql://${role}:${password}@${host}/${database}?sslmode=require"

          pooled=$(echo "$direct" | sed -E "s|@([^.]+)\.|@\1-pooler.|")
          echo "::add-mask::$direct"
          echo "::add-mask::$pooled"
          echo "direct=$direct" >> "$GITHUB_OUTPUT"
          echo "pooled=$pooled" >> "$GITHUB_OUTPUT"
          echo "Created branch ci-prod-${GITHUB_RUN_ID} ($branch_id)"

      # THE DEV BRANCH'S URLS, NEVER PRODUCTION'S. `.env` is what the suite
      # reads and what the gate scrubs the environment down to; production's
      # credential reaches `deploy.mjs` through the environment instead, and
      # only for the two SELECTs this workflow's header names.
      - name: write .env from secrets and the branch
        env:
          DIRECT: ${{ steps.branch.outputs.direct }}
          POOLED: ${{ steps.branch.outputs.pooled }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SEED_OWNER_EMAIL: ${{ secrets.SEED_OWNER_EMAIL }}
          SEED_OWNER_PASSWORD: ${{ secrets.SEED_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "DATABASE_URL=${POOLED}"
            echo "DIRECT_DATABASE_URL=${DIRECT}"
            echo "NEON_BRANCH=ci-prod-${GITHUB_RUN_ID}"
            echo "AUTH_SECRET=${AUTH_SECRET}"
            echo "R2_ACCOUNT_ID=${R2_ACCOUNT_ID}"
            echo "R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
            echo "R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
            echo "R2_BUCKET=${R2_BUCKET}"
            echo "R2_ENDPOINT=${R2_ENDPOINT}"
            echo "SEED_OWNER_EMAIL=${SEED_OWNER_EMAIL}"
            echo "SEED_OWNER_PASSWORD=${SEED_OWNER_PASSWORD}"
          } > .env

      - name: install
        run: npm ci

      # ── THE SCHEMA MUST ALREADY BE THERE ─────────────────────────────
      #
      # As early as it can be — it needs `node_modules`, so it sits just after
      # the install and well before a suite that costs a quarter of an hour.
      # This is the same check `deploy.mjs` makes, made early so a forgotten
      # ritual costs a minute rather than fifteen.
      - name: production schema is not behind
        env:
          PROD_DIRECT_DATABASE_URL: ${{ secrets.PROD_DIRECT_DATABASE_URL_RO }}
        run: node scripts/check-migration-gap.mjs

      - name: measure the round trip to the branch
        env:
          PGURL: ${{ steps.branch.outputs.direct }}
        run: node scripts/ci-round-trip.mjs

      - name: the working tree is clean
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "The tree is dirty before the suite has run:"
            git status --porcelain
            exit 1
          fi
          echo "clean at $(git rev-parse --short HEAD)"

      - name: gate
        run: npm run check

      - name: integration suite
        run: npm run test:integration

      - name: deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROD_DIRECT_DATABASE_URL: ${{ secrets.PROD_DIRECT_DATABASE_URL_RO }}
        run: npm run deploy:prod

      - name: keep the failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failures-prod-${{ github.run_id }}
          path: .integration-failures.log
          if-no-files-found: ignore

      - name: delete the Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_ID: ${{ steps.branch.outputs.branch_id }}
        run: |
          set -euo pipefail
          curl -sS -X DELETE \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${BRANCH_ID}" \
            -H "Authorization: Bearer ${NEON_API_KEY}" > /dev/null
          echo "deleted branch ${BRANCH_ID}"
